<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Aerial view of a desk with a stack of papers, a laptop, a trading monitor, and a gavel with a microphone">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- floor -->
  <rect width="1600" height="1000" fill="#f3ede2"/>

  <!-- desk shadow + top -->
  <rect x="140" y="150" width="1350" height="760" rx="28" fill="#3a2c1a" opacity="0.18" filter="url(#soft)"/>
  <rect x="125" y="125" width="1350" height="750" rx="24" fill="#c8a97e"/>
  <!-- desk mat -->
  <rect x="455" y="350" width="690" height="405" rx="18" fill="#a5794f"/>

  <!-- ── papers (research) ── -->
  <g transform="translate(350 440)">
    <rect x="-75" y="-95" width="150" height="196" rx="6" transform="rotate(-6)" fill="#3a2c1a" opacity="0.15" filter="url(#softer)"/>
    <rect x="-72" y="-98" width="144" height="190" rx="5" transform="rotate(-5)" fill="#eae6dc"/>
    <rect x="-72" y="-98" width="144" height="190" rx="5" transform="rotate(-2)" fill="#f1eee6"/>
    <rect x="-72" y="-98" width="144" height="190" rx="5" transform="rotate(2)" fill="#f8f6f1"/>
    <g transform="rotate(2)">
      <rect x="-52" y="-68" width="104" height="8" rx="4" fill="#c9c4b8"/>
      <rect x="-52" y="-46" width="84" height="8" rx="4" fill="#d6d2c7"/>
      <rect x="-52" y="-24" width="96" height="8" rx="4" fill="#d6d2c7"/>
      <rect x="-52" y="-2" width="70" height="8" rx="4" fill="#d6d2c7"/>
    </g>
    <rect x="10" y="34" width="120" height="9" rx="4.5" transform="rotate(24 10 34)" fill="#2b2b2b"/>
  </g>

  <!-- ── laptop (ATT agency) ── -->
  <g transform="translate(650 545) rotate(-12)">
    <rect x="-95" y="-125" width="190" height="250" rx="10" fill="#3a2c1a" opacity="0.15" filter="url(#softer)"/>
    <!-- screen half -->
    <rect x="-90" y="-128" width="180" height="118" rx="8" fill="#2a2d33"/>
    <rect x="-80" y="-119" width="160" height="100" rx="4" fill="#5b8cff"/>
    <rect x="-66" y="-104" width="70" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
    <rect x="-66" y="-84" width="120" height="8" rx="4" fill="#ffffff" opacity="0.45"/>
    <rect x="-66" y="-68" width="100" height="8" rx="4" fill="#ffffff" opacity="0.45"/>
    <rect x="-66" y="-46" width="52" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
    <!-- keyboard half -->
    <rect x="-90" y="-6" width="180" height="128" rx="8" fill="#cfd3d9"/>
    <rect x="-78" y="6" width="156" height="66" rx="5" fill="#b7bcc4"/>
    <rect x="-40" y="86" width="80" height="26" rx="5" fill="#b7bcc4"/>
  </g>

  <!-- ── trading monitor (markets) ── -->
  <g transform="translate(980 425)">
    <rect x="-105" y="-70" width="210" height="140" rx="10" fill="#3a2c1a" opacity="0.18" filter="url(#softer)"/>
    <rect x="-101" y="-66" width="202" height="130" rx="9" fill="#14181c"/>
    <rect x="-91" y="-56" width="182" height="110" rx="5" fill="#08130d"/>
    <g>
      <rect x="-75" y="-14" width="9" height="27" fill="#33d17a"/>
      <rect x="-54" y="-30" width="9" height="45" fill="#33d17a"/>
      <rect x="-33" y="-8" width="9" height="33" fill="#ff5c57"/>
      <rect x="-12" y="-38" width="9" height="54" fill="#33d17a"/>
      <rect x="9" y="-18" width="9" height="39" fill="#ff5c57"/>
      <rect x="30" y="-47" width="9" height="63" fill="#33d17a"/>
      <rect x="51" y="-28" width="9" height="45" fill="#33d17a"/>
      <rect x="72" y="-10" width="9" height="36" fill="#ff5c57"/>
    </g>
    <rect x="-14" y="66" width="28" height="34" rx="4" fill="#2c2f34"/>
    <ellipse cx="0" cy="104" rx="42" ry="10" fill="#2c2f34"/>
  </g>

  <!-- ── gavel + microphone (leadership) ── -->
  <g transform="translate(1250 560)">
    <ellipse cx="55" cy="34" rx="44" ry="40" fill="#3a2c1a" opacity="0.2" filter="url(#softer)"/>
    <!-- sound block -->
    <circle cx="52" cy="30" r="40" fill="#7a4a22"/>
    <circle cx="52" cy="30" r="31" fill="#8a5628"/>
    <!-- gavel -->
    <g transform="translate(8 -18) rotate(-28)">
      <rect x="8" y="-7" width="86" height="14" rx="7" fill="#7a4a22"/>
      <rect x="-30" y="-21" width="52" height="42" rx="12" fill="#9a6a35"/>
    </g>
    <!-- microphone -->
    <g transform="translate(-70 -18)">
      <ellipse cx="4" cy="66" rx="26" ry="8" fill="#3a3a3a"/>
      <rect x="1" y="-32" width="6" height="98" rx="3" fill="#3a3a3a"/>
      <circle cx="4" cy="-42" r="17" fill="#1f1f1f"/>
      <circle cx="0" cy="-46" r="5" fill="#4a4a4a"/>
    </g>
  </g>

  <!-- ── coffee mug ── -->
  <g transform="translate(485 755)">
    <ellipse cx="4" cy="6" rx="32" ry="30" fill="#3a2c1a" opacity="0.2" filter="url(#softer)"/>
    <circle cx="0" cy="0" r="28" fill="#2f6f6a"/>
    <circle cx="0" cy="0" r="21" fill="#241a12"/>
    <path d="M 26 -6 A 14 14 0 1 1 26 8" fill="none" stroke="#2f6f6a" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
